<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>สร้างบัญชีครู</title>
<style>body{font-family:'Prompt',system-ui,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem;line-height:1.7}label{display:block;margin:.8rem 0 .2rem;font-weight:600}input,select,textarea{width:100%;padding:.6rem;font:inherit;border:2px solid #ccd;border-radius:10px;box-sizing:border-box}button{margin-top:1rem;padding:.7rem 1.4rem;font:inherit;font-weight:600;border:0;border-radius:999px;background:#1a73c4;color:#fff;cursor:pointer}textarea{font-family:monospace;min-height:9rem}.row{display:flex;gap:.6rem;align-items:center}.row input{width:auto}</style></head>
<body>
<h1>สร้างบัญชีครู</h1>
<p>กรอกข้อมูลแล้วกดสร้าง จะได้ข้อความ 1 บรรทัดสำหรับนำไปรวมในตัวแปร <b>USERS</b> ของ Cloudflare Worker (ทำงานในเครื่องคุณเท่านั้น ไม่ส่งรหัสผ่านไปที่ไหน)</p>
<label>ชื่อผู้ใช้ (ภาษาอังกฤษพิมพ์เล็ก ตัวเลข _ - ยาว 2–32 ตัว)<input id="u" autocomplete="off"></label>
<label>ชื่อที่แสดง (เช่น ครูสมชาย)<input id="n"></label>
<label>ครูผู้สอนในระบบเว็บ (ผูกบัญชีนี้กับรายชื่อครู)<select id="t"><option value="">— ไม่ผูก (ใช้เมื่อเป็นบัญชีผู้ดูแลทั้งหมด) —</option></select></label>
<div class="row"><input type="checkbox" id="all"><label for="all" style="margin:0">ผู้ดูแลทั้งหมด (แก้ได้ทุกคอร์ส)</label></div>
<label>รหัสผ่าน (ควรยาว 10 ตัวขึ้นไป)<div class="row"><input id="p" type="text" autocomplete="off"><button type="button" id="r" style="margin:0">สุ่ม</button></div></label>
<button type="button" id="go">สร้างบัญชี</button>
<label>ผลลัพธ์ (คัดลอกไปวางในตัวแปร USERS แยกแต่ละบัญชีด้วยเครื่องหมายจุลภาค แล้วครอบด้วย { })<textarea id="out" readonly></textarea></label>
<script>
const $=id=>document.getElementById(id),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
fetch('../data/teacher-api.json').then(r=>r.json()).then(j=>j.teachers.forEach(t=>{const o=document.createElement('option');o.value=t.id;o.textContent=t.name;$('t').append(o)})).catch(()=>{});
$('r').onclick=()=>{const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';$('p').value=[...crypto.getRandomValues(new Uint8Array(12))].map(x=>c[x%c.length]).join('')};
$('go').onclick=async()=>{
  const u=$('u').value.trim().toLowerCase(),p=$('p').value;
  if(!/^[a-z0-9_-]{2,32}$/.test(u)) return alert('ชื่อผู้ใช้ไม่ถูกต้อง');
  if(p.length<8) return alert('รหัสผ่านสั้นเกินไป');
  const salt=crypto.getRandomValues(new Uint8Array(16)),iter=20000;
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
  const hash=hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},key,256));
  const rec={salt:hex(salt),iter,hash,name:$('n').value.trim()||u,teacher:$('t').value};
  if($('all').checked) rec.all=true;
  $('out').value=JSON.stringify(u)+': '+JSON.stringify(rec);
};
</script></body></html>
