# ตั้งค่าหน้าแอดมิน (Sveltia CMS) ป้ายกำกับทั้งหมดเป็นภาษาไทย
# *** แก้เฉพาะบรรทัด repo: ด้านล่างครั้งเดียวตอนติดตั้ง ***

backend:
  name: github
  repo: IamKUN67/BFF-Website-2026
  branch: main

locale: th
publish_mode: simple
site_url: https://iamkun67.github.io/BFF-Website-2026/

# รูปที่อัปโหลดเก็บใน public/uploads
media_folder: public/uploads
public_folder: /uploads

# ย่อรูปและแปลงเป็น WebP อัตโนมัติตั้งแต่ตอนอัปโหลด
media_libraries:
  default:
    config:
      max_file_size: 10485760
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

collections:
  # ───────────── 1) ตั้งค่าเว็บไซต์ + 2) เมนู ─────────────
  - name: settings
    label: "ตั้งค่าเว็บไซต์"
    files:
      - name: site
        label: "ตั้งค่าทั่วไป"
        file: src/content/settings/site.json
        format: json
        fields:
          - { name: siteName, label: "ชื่อเว็บไซต์", widget: string }
          - { name: tagline, label: "ชื่อรอง", widget: string, required: false }
          - { name: welcomeTitle, label: "หัวข้อต้อนรับหน้าแรก", widget: string, required: false }
          - { name: welcomeText, label: "ข้อความต้อนรับหน้าแรก", widget: text, required: false }
          - name: logo
            label: "รูปโลโก้"
            widget: object
            required: false
            fields:
              - { name: src, label: "ไฟล์รูป", widget: image, required: false }
              - { name: alt, label: "คำอธิบายรูป (alt) ภาษาไทย", widget: string, required: false, hint: "ถ้าใส่รูป ต้องกรอกช่องนี้ด้วย" }
          - name: cover
            label: "รูปปก"
            widget: object
            required: false
            fields:
              - { name: src, label: "ไฟล์รูป", widget: image, required: false }
              - { name: alt, label: "คำอธิบายรูป (alt) ภาษาไทย", widget: string, required: false, hint: "ถ้าใส่รูป ต้องกรอกช่องนี้ด้วย" }
          - name: colors
            label: "สีของเว็บไซต์"
            widget: object
            fields:
              - { name: primary, label: "สีหลัก", widget: color, default: "#1a73c4" }
              - { name: accent, label: "สีเน้น", widget: color, default: "#d32f2f" }
          - name: social
            label: "ลิงก์โซเชียล"
            widget: object
            fields:
              - { name: instagram, label: "Instagram (ลิงก์เต็ม)", widget: string, required: false }
              - { name: facebook, label: "Facebook (ลิงก์เต็ม)", widget: string, required: false }
              - { name: youtube, label: "YouTube (ลิงก์เต็ม)", widget: string, required: false }
              - { name: line, label: "LINE (ลิงก์เต็ม)", widget: string, required: false }
              - { name: discord, label: "Discord (ลิงก์เชิญ)", widget: string, required: false }
          - { name: email, label: "อีเมล", widget: string, required: false }
          - { name: address, label: "ที่อยู่", widget: text, required: false }
          - { name: footerText, label: "ข้อความท้ายเว็บ", widget: string, required: false }

      - name: labels
        label: "ข้อความในหน้าเว็บ"
        file: src/data/labels.json
        format: json
        fields:
          - { name: skipToContent, label: "ลิงก์ข้ามไปเนื้อหา (สำหรับโปรแกรมอ่านจอ)", widget: string }
          - { name: menuButton, label: "ปุ่มเปิด/ปิดเมนู (โปรแกรมอ่านจอ)", widget: string }
          - { name: mainNav, label: "ชื่อกลุ่มเมนูหลัก (โปรแกรมอ่านจอ)", widget: string }
          - { name: subMenuButton, label: "ปุ่มเปิด/ปิดเมนูย่อย (โปรแกรมอ่านจอ)", widget: string }
          - { name: heroCta, label: "ปุ่มในส่วนต้อนรับ", widget: string }
          - { name: latestNewsTitle, label: "หัวข้อ: ข่าวล่าสุด", widget: string }
          - { name: allNews, label: "ปุ่ม: ดูข่าวทั้งหมด", widget: string }
          - { name: calendarTitle, label: "หัวข้อ: ปฏิทินกิจกรรม", widget: string }
          - { name: upcomingEvents, label: "หัวข้อ: กิจกรรมที่กำลังจะมาถึง", widget: string }
          - { name: noEvents, label: "ข้อความเมื่อไม่มีกิจกรรม", widget: string }
          - { name: prevMonth, label: "ปุ่มเดือนก่อนหน้า", widget: string }
          - { name: nextMonth, label: "ปุ่มเดือนถัดไป", widget: string }
          - { name: eventLocation, label: "คำว่า สถานที่", widget: string }
          - { name: eventLink, label: "ลิงก์ดูรายละเอียดกิจกรรม", widget: string }
          - { name: contactTitle, label: "หัวข้อ: ติดต่อเรา", widget: string }
          - { name: contactEmpty, label: "ข้อความเมื่อยังไม่มีข้อมูลติดต่อ", widget: string }
          - { name: emailLabel, label: "คำว่า อีเมล", widget: string }
          - { name: addressLabel, label: "คำว่า ที่อยู่", widget: string }
          - { name: moreContact, label: "ปุ่มช่องทางติดต่อเพิ่มเติม", widget: string }
          - { name: newsPageTitle, label: "หัวข้อหน้าข่าว", widget: string }
          - { name: searchLabel, label: "ชื่อช่องค้นหา", widget: string }
          - { name: searchPlaceholder, label: "ข้อความในช่องค้นหา", widget: string }
          - { name: categoryLabel, label: "ชื่อตัวกรองหมวดหมู่", widget: string }
          - { name: allCategories, label: "ตัวเลือก: ทุกหมวดหมู่", widget: string }
          - { name: noResults, label: "ข้อความเมื่อค้นไม่เจอ", widget: string }
          - { name: noNews, label: "ข้อความเมื่อยังไม่มีข่าว", widget: string }
          - { name: prevPage, label: "ปุ่มหน้าก่อนหน้า", widget: string }
          - { name: nextPage, label: "ปุ่มหน้าถัดไป", widget: string }
          - { name: pageOf, label: "ข้อความเลขหน้า (คง {page} และ {total} ไว้)", widget: string }
          - { name: newBadge, label: "ป้าย New", widget: string }
          - { name: pinnedBadge, label: "ป้ายปักหมุด", widget: string }
          - { name: postedOn, label: "คำว่า โพสต์เมื่อ", widget: string }
          - { name: updatedOn, label: "คำว่า อัปเดตเมื่อ", widget: string }
          - { name: openChannel, label: "ข้อความบนการ์ดช่องทางติดต่อ", widget: string }
          - { name: openLink, label: "ปุ่มบนการ์ดลิงก์ใหญ่", widget: string }
          - { name: socialYoutube, label: "ชื่อ YouTube", widget: string }
          - { name: closeImage, label: "ปุ่มปิดรูปขยาย (โปรแกรมอ่านจอ)", widget: string }
          - { name: prevImage, label: "ปุ่มรูปก่อนหน้า (โปรแกรมอ่านจอ)", widget: string }
          - { name: nextImage, label: "ปุ่มรูปถัดไป (โปรแกรมอ่านจอ)", widget: string }
          - { name: zoomImage, label: "ข้อความรูปที่กดขยายได้ (โปรแกรมอ่านจอ)", widget: string }
          - { name: videoDefaultTitle, label: "ชื่อวิดีโอเริ่มต้น (โปรแกรมอ่านจอ)", widget: string }
          - { name: teachersTitle, label: "หัวข้อ: ครูผู้สอน", widget: string }
          - { name: coursesTitle, label: "หัวข้อ: คอร์สเรียน", widget: string }
          - { name: courseSchedule, label: "คำว่า วันและเวลาเรียน", widget: string }
          - { name: coursePeriod, label: "คำว่า ช่วงเวลาที่เปิดสอน", widget: string }
          - { name: courseTeachers, label: "คำว่า ครูผู้สอน (ในการ์ดคอร์ส)", widget: string }
          - { name: relatedNews, label: "หัวข้อ: ข่าวประชาสัมพันธ์ (ท้ายหน้าวิชา)", widget: string }
          - { name: enterHome, label: "ปุ่มเข้าสู่หน้าหลัก (ถ้าไม่ได้ตั้งปุ่มเอง)", widget: string }
          - { name: introLabel, label: "ชื่อกลุ่มสไลด์ (โปรแกรมอ่านจอ)", widget: string }
          - { name: slidePrev, label: "ปุ่มสไลด์ก่อนหน้า", widget: string }
          - { name: slideNext, label: "ปุ่มสไลด์ถัดไป", widget: string }
          - { name: slidePause, label: "ปุ่มหยุดเลื่อนอัตโนมัติ", widget: string }
          - { name: slidePlay, label: "ปุ่มเริ่มเลื่อนอัตโนมัติ", widget: string }
          - { name: slideGoto, label: "จุดเลือกสไลด์ (คง {n} ไว้)", widget: string }
          - { name: openFile, label: "ปุ่มเปิดไฟล์ในสไลด์", widget: string }
          - { name: galleryTitle, label: "หัวข้ออัลบั้มรูป", widget: string }
          - { name: backToNews, label: "ลิงก์กลับไปหน้าข่าว", widget: string }
          - { name: boardTitle, label: "หัวข้อส่วนผู้บริหาร", widget: string }
          - { name: noBoard, label: "ข้อความเมื่อยังไม่มีรายชื่อ", widget: string }
          - { name: notFoundTitle, label: "หัวข้อหน้าไม่พบ", widget: string }
          - { name: notFoundText, label: "ข้อความหน้าไม่พบ", widget: string }
          - { name: backHome, label: "ปุ่มกลับหน้าแรก", widget: string }
          - { name: externalHint, label: "คำอธิบายลิงก์ที่เปิดแท็บใหม่ (โปรแกรมอ่านจอ)", widget: string }
          - { name: socialInstagram, label: "ชื่อ Instagram", widget: string }
          - { name: socialFacebook, label: "ชื่อ Facebook", widget: string }
          - { name: socialLine, label: "ชื่อ LINE", widget: string }
          - { name: socialDiscord, label: "ชื่อ Discord", widget: string }
          - { name: newsCategories, label: "หมวดหมู่ข่าวในตัวกรอง (ควรตรงกับหมวดในฟอร์มข่าว)", widget: list, field: { name: category, label: "ชื่อหมวด", widget: string } }

      - name: intro
        label: "หน้าสไลด์ต้อนรับ (หน้าแรกสุดของลิงก์เว็บ)"
        file: src/content/intro/intro.json
        format: json
        fields:
          - { name: enabled, label: "เปิดใช้หน้าสไลด์ต้อนรับ (ปิด = เข้าหน้าหลักทันที)", widget: boolean, default: true }
          - { name: title, label: "หัวข้อ", widget: string, required: false }
          - { name: subtitle, label: "ข้อความรอง", widget: string, required: false }
          - { name: autoplay, label: "เลื่อนสไลด์อัตโนมัติ", widget: boolean, default: true }
          - { name: interval, label: "เวลาต่อสไลด์ (วินาที)", widget: number, value_type: int, min: 3, max: 30, default: 6 }
          - name: slides
            label: "สไลด์ (ลากเรียงลำดับได้)"
            label_singular: "สไลด์"
            widget: list
            required: false
            summary: "{{fields.caption}} {{fields.file}} {{fields.youtube}}"
            fields:
              - { name: file, label: "ไฟล์ (รูป วิดีโอ MP4 หรือไฟล์อื่นๆ) — วิดีโอยาวให้ใช้ลิงก์ YouTube แทน", widget: file, required: false }
              - { name: youtube, label: "หรือวางลิงก์ YouTube (ถ้าใส่ จะใช้ YouTube แทนไฟล์)", widget: string, required: false }
              - { name: alt, label: "คำอธิบายรูป/วิดีโอ (alt) ภาษาไทย", widget: string, required: false }
              - { name: caption, label: "ข้อความใต้สไลด์", widget: string, required: false }
          - name: buttons
            label: "ปุ่มในหน้าสไลด์ (เพิ่มเองได้ ลิงก์ในเว็บขึ้นต้นด้วย / เช่น /home/ หรือลิงก์นอกเว็บขึ้นต้นด้วย https://)"
            label_singular: "ปุ่ม"
            widget: list
            required: false
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: "ข้อความบนปุ่ม", widget: string }
              - { name: url, label: "ลิงก์ปลายทาง", widget: string }
              - { name: color, label: "สีปุ่ม (สีตัวอักษรจะปรับให้อ่านชัดเอง)", widget: color, required: false }

      - name: menu
        label: "เมนู"
        file: src/content/menu/menu.json
        format: json
        fields:
          - name: items
            label: "รายการเมนูหลัก (ลากเพื่อเรียงลำดับ)"
            label_singular: "เมนู"
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: "ชื่อเมนู", widget: string }
              - name: icon
                label: "ไอคอนแทนชื่อเมนู (เว้นว่าง = แสดงเป็นข้อความ)"
                widget: select
                required: false
                options:
                  - { label: "บ้าน", value: "house" }
                  - { label: "โทรโข่ง", value: "megaphone" }
                  - { label: "โรงเรียน", value: "school" }
                  - { label: "ถาดสีศิลปะ", value: "palette" }
                  - { label: "โทรศัพท์", value: "phone" }
              - { name: link, label: "ลิงก์", widget: string, required: false, hint: "ลิงก์ในเว็บขึ้นต้นด้วย / เช่น /news/ หรือ /pages/thai/ ส่วนลิงก์นอกเว็บขึ้นต้นด้วย https:// ถ้าเมนูนี้มีเมนูย่อย เว้นว่างได้" }
              - name: children
                label: "เมนูย่อย (ลากเพื่อเรียงลำดับ)"
                label_singular: "เมนูย่อย"
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: "ชื่อเมนูย่อย", widget: string }
                  - { name: link, label: "ลิงก์", widget: string }

  # ───────────── 3) โพสต์ข่าว/กิจกรรม ─────────────
  - name: posts
    label: "ข่าว/กิจกรรม"
    label_singular: "ข่าว"
    folder: src/content/posts
    extension: md
    format: frontmatter
    create: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{title}} — {{status}}"
    sortable_fields: [title, date, status]
    fields:
      - { name: title, label: "หัวข้อ", widget: string }
      - name: status
        label: "สถานะ"
        widget: select
        default: draft
        options:
          - { label: "ร่าง (ยังไม่แสดงบนเว็บ)", value: draft }
          - { label: "เผยแพร่", value: published }
      - { name: date, label: "วันที่โพสต์", widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, picker_utc: false, required: false }
      - { name: updated, label: "วันที่อัปเดต", widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, picker_utc: false, required: false }
      - name: category
        label: "หมวดหมู่"
        widget: select
        required: false
        options: ["ข่าวประชาสัมพันธ์ทั่วไป", "ข่าวการศึกษา"]
      - { name: pinned, label: "ปักหมุดข่าว", widget: boolean, default: false }
      - { name: isNew, label: "ป้าย New", widget: boolean, default: false }
      - { name: notes, label: "หมายเหตุภายใน (ไม่แสดงบนเว็บ)", widget: text, required: false }
      - name: cover
        label: "รูปปก"
        widget: object
        required: false
        fields:
          - { name: src, label: "ไฟล์รูป", widget: image, required: false }
          - { name: alt, label: "คำอธิบายรูป (alt) ภาษาไทย", widget: string, required: false, hint: "ถ้าใส่รูป ต้องกรอกช่องนี้ด้วย" }
      - { name: body, label: "ข้อความนำ (ไม่บังคับ แสดงก่อนส่วนเนื้อหา)", widget: markdown, required: false }
      - name: sections
        label: "ส่วนเนื้อหา (เพิ่มได้หลายส่วน: หัวข้อ + รูป + ข้อความ + อัลบั้ม + วิดีโอ)"
        label_singular: "ส่วน"
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - { name: title, label: "หัวข้อของส่วนนี้ เช่น กิจกรรมปีใหม่", widget: string, required: false }
          - name: image
            label: "รูปประกอบข้อความ (แสดงข้างข้อความ)"
            widget: object
            required: false
            fields:
              - { name: src, label: "ไฟล์รูป", widget: image, required: false }
              - { name: alt, label: "คำอธิบายรูป (alt) ภาษาไทย — แสดงตอนกดขยายรูป", widget: string, required: false }
          - name: imageSize
            label: "ขนาดรูปประกอบ"
            widget: select
            default: "50"
            required: false
            options:
              - { label: "เล็ก (25% ของความกว้าง)", value: "25" }
              - { label: "กลาง (50%)", value: "50" }
              - { label: "ใหญ่ (75%)", value: "75" }
              - { label: "เต็มความกว้าง (100%)", value: "100" }
          - name: imageAlign
            label: "ตำแหน่งรูป (ชิดซ้าย/ขวา = ข้อความไหลล้อมรูป, กึ่งกลาง = รูปอยู่เหนือข้อความ)"
            widget: select
            default: "left"
            required: false
            options:
              - { label: "ชิดซ้าย", value: "left" }
              - { label: "กึ่งกลาง", value: "center" }
              - { label: "ชิดขวา", value: "right" }
          - { name: text, label: "ข้อความ", widget: markdown, required: false }
          - name: textAlign
            label: "การจัดข้อความ"
            widget: select
            default: "left"
            required: false
            options:
              - { label: "ชิดซ้าย", value: "left" }
              - { label: "กึ่งกลาง", value: "center" }
              - { label: "ชิดขวา", value: "right" }
              - { label: "เต็มบรรทัด (สองข้าง)", value: "justify" }
          - name: textSize
            label: "ขนาดตัวอักษร"
            widget: select
            default: "normal"
            required: false
            options:
              - { label: "ปกติ", value: "normal" }
              - { label: "ใหญ่", value: "large" }
              - { label: "ใหญ่มาก", value: "xlarge" }
          - name: album
            label: "อัลบั้มรูปของส่วนนี้ (กดรูปเพื่อขยายได้)"
            label_singular: "รูป"
            widget: list
            required: false
            summary: "{{fields.alt}}"
            fields:
              - { name: src, label: "ไฟล์รูป", widget: image }
              - { name: alt, label: "คำอธิบายรูป (alt) ภาษาไทย — แสดงตอนกดขยายรูป", widget: string }
          - name: albumSize
            label: "ขนาดรูปในอัลบั้ม"
            widget: select
            default: "3"
            required: false
            options:
              - { label: "เล็ก (4 คอลัมน์)", value: "4" }
              - { label: "กลาง (3 คอลัมน์)", value: "3" }
              - { label: "ใหญ่ (2 คอลัมน์)", value: "2" }
          - name: videos
            label: "วิดีโอ YouTube"
            label_singular: "วิดีโอ"
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: url, label: "ลิงก์ YouTube (วางลิงก์จากแถบที่อยู่หรือปุ่มแชร์)", widget: string }
              - { name: title, label: "ชื่อวิดีโอ (แสดงใต้วิดีโอ)", widget: string, required: false }

  # ───────────── 4) หน้าทั่วไป ─────────────
  - name: pages
    label: "หน้าทั่วไป"
    label_singular: "หน้า"
    folder: src/content/pages
    extension: md
    format: frontmatter
    create: true
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: "ชื่อหน้า", widget: string }
      - { name: slug, label: "ชื่อลิงก์ (ภาษาอังกฤษพิมพ์เล็ก/ตัวเลข/ขีดกลางเท่านั้น)", widget: string, pattern: ["^[a-z0-9-]+$", "ใช้ได้เฉพาะ a-z 0-9 และ -"], hint: "เช่น thai-subject จะได้ลิงก์ /pages/thai-subject/" }
      - { name: description, label: "คำอธิบายสั้น (ใช้ใน Google)", widget: text, required: false }
      - { name: legacy, label: "ระบบเก่า (ซ่อนจากเมนูหลัก แต่เปิดผ่านลิงก์ได้)", widget: boolean, default: false }
      - { name: showContact, label: "แสดงช่องทางติดต่อ (ดึงจากตั้งค่าเว็บไซต์) ในหน้านี้", widget: boolean, default: false }
      - { name: showExecutives, label: "แสดงรายชื่อผู้บริหารท้ายหน้านี้", widget: boolean, default: false }
      - name: newsCategory
        label: "แสดงข่าวหมวดนี้ท้ายหน้า"
        widget: select
        required: false
        options: ["ข่าวการศึกษา", "ข่าวประชาสัมพันธ์ทั่วไป"]
      - name: teachers
        label: "ครูผู้สอนประจำวิชานี้ (เลือกจากรายชื่อครู ต้องเพิ่มครูในเมนู ครูผู้สอน ก่อน)"
        widget: relation
        collection: teachers
        search_fields: [name]
        value_field: "{{slug}}"
        display_fields: [name]
        multiple: true
        required: false
      - name: links
        label: "ปุ่มลิงก์ใหญ่ (เช่น ลิงก์แบบฟอร์ม)"
        label_singular: "ลิงก์"
        widget: list
        required: false
        summary: "{{fields.label}}"
        fields:
          - { name: label, label: "ชื่อปุ่ม", widget: string }
          - { name: url, label: "ลิงก์", widget: string }
          - { name: note, label: "ข้อความเล็กใต้ชื่อ", widget: string, required: false }
      - name: courses
        label: "คอร์สเรียนของวิชานี้ (เพิ่มได้หลายคอร์ส ลากเรียงลำดับได้)"
        label_singular: "คอร์ส"
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - { name: title, label: "ชื่อคอร์ส", widget: string }
          - { name: group, label: "หมวดหมู่คอร์ส (ไม่บังคับ คอร์สที่ใส่หมวดเดียวกันจะอยู่ใต้หัวข้อเดียวกัน)", widget: string, required: false }
          - { name: startDate, label: "วันเริ่มเรียน", widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, picker_utc: false, required: false }
          - { name: endDate, label: "วันสิ้นสุดคอร์ส", widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, picker_utc: false, required: false }
          - { name: schedule, label: "วันและเวลาเรียน (เช่น เสาร์ 09:00-11:00)", widget: text, required: false }
          - name: teachers
            label: "ครูผู้สอนคอร์สนี้ (เลือกได้หลายคน)"
            widget: relation
            collection: teachers
            search_fields: [name]
            value_field: "{{slug}}"
            display_fields: [name]
            multiple: true
            required: false
          - { name: description, label: "รายละเอียดคอร์ส", widget: markdown, required: false }
          - name: links
            label: "ลิงก์แนบ (เช่น ลิงก์คะแนน)"
            label_singular: "ลิงก์"
            widget: list
            required: false
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: "ชื่อปุ่ม เช่น ดูคะแนน", widget: string }
              - { name: url, label: "ลิงก์", widget: string }
      - { name: body, label: "ข้อความนำ (ไม่บังคับ)", widget: markdown, required: false }
      - name: sections
        label: "ส่วนเนื้อหา (เพิ่มได้หลายส่วน: หัวข้อ + รูป + ข้อความ + อัลบั้ม + วิดีโอ)"
        label_singular: "ส่วน"
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - { name: title, label: "หัวข้อของส่วนนี้ เช่น กิจกรรมปีใหม่", widget: string, required: false }
          - name: image
            label: "รูปประกอบข้อความ (แสดงข้างข้อความ)"
            widget: object
            required: false
            fields:
              - { name: src, label: "ไฟล์รูป", widget: image, required: false }
              - { name: alt, label: "คำอธิบายรูป (alt) ภาษาไทย — แสดงตอนกดขยายรูป", widget: string, required: false }
          - name: imageSize
            label: "ขนาดรูปประกอบ"
            widget: select
            default: "50"
            required: false
            options:
              - { label: "เล็ก (25% ของความกว้าง)", value: "25" }
              - { label: "กลาง (50%)", value: "50" }
              - { label: "ใหญ่ (75%)", value: "75" }
              - { label: "เต็มความกว้าง (100%)", value: "100" }
          - name: imageAlign
            label: "ตำแหน่งรูป (ชิดซ้าย/ขวา = ข้อความไหลล้อมรูป, กึ่งกลาง = รูปอยู่เหนือข้อความ)"
            widget: select
            default: "left"
            required: false
            options:
              - { label: "ชิดซ้าย", value: "left" }
              - { label: "กึ่งกลาง", value: "center" }
              - { label: "ชิดขวา", value: "right" }
          - { name: text, label: "ข้อความ", widget: markdown, required: false }
          - name: textAlign
            label: "การจัดข้อความ"
            widget: select
            default: "left"
            required: false
            options:
              - { label: "ชิดซ้าย", value: "left" }
              - { label: "กึ่งกลาง", value: "center" }
              - { label: "ชิดขวา", value: "right" }
              - { label: "เต็มบรรทัด (สองข้าง)", value: "justify" }
          - name: textSize
            label: "ขนาดตัวอักษร"
            widget: select
            default: "normal"
            required: false
            options:
              - { label: "ปกติ", value: "normal" }
              - { label: "ใหญ่", value: "large" }
              - { label: "ใหญ่มาก", value: "xlarge" }
          - name: album
            label: "อัลบั้มรูปของส่วนนี้ (กดรูปเพื่อขยายได้)"
            label_singular: "รูป"
            widget: list
            required: false
            summary: "{{fields.alt}}"
            fields:
              - { name: src, label: "ไฟล์รูป", widget: image }
              - { name: alt, label: "คำอธิบายรูป (alt) ภาษาไทย — แสดงตอนกดขยายรูป", widget: string }
          - name: albumSize
            label: "ขนาดรูปในอัลบั้ม"
            widget: select
            default: "3"
            required: false
            options:
              - { label: "เล็ก (4 คอลัมน์)", value: "4" }
              - { label: "กลาง (3 คอลัมน์)", value: "3" }
              - { label: "ใหญ่ (2 คอลัมน์)", value: "2" }
          - name: videos
            label: "วิดีโอ YouTube"
            label_singular: "วิดีโอ"
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: url, label: "ลิงก์ YouTube (วางลิงก์จากแถบที่อยู่หรือปุ่มแชร์)", widget: string }
              - { name: title, label: "ชื่อวิดีโอ (แสดงใต้วิดีโอ)", widget: string, required: false }

  # ───────────── 5) ปฏิทินกิจกรรม ─────────────
  - name: events
    label: "ปฏิทินกิจกรรม"
    label_singular: "กิจกรรม"
    folder: src/content/events
    extension: json
    format: json
    create: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: "ชื่อกิจกรรม", widget: string }
      - { name: start, label: "วันเริ่ม", widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, picker_utc: false }
      - { name: end, label: "วันสิ้นสุด", widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, picker_utc: false, required: false }
      - { name: location, label: "สถานที่", widget: string, required: false }
      - { name: details, label: "รายละเอียด", widget: text, required: false }
      - { name: link, label: "ลิงก์", widget: string, required: false }

  # ───────────── 6) สมาชิก/บอร์ดบริหาร ─────────────
  - name: board
    label: "ผู้บริหาร"
    label_singular: "ผู้บริหาร"
    folder: src/content/board
    extension: json
    format: json
    create: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{order}}. {{name}} — {{position}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: "ชื่อ", widget: string }
      - { name: position, label: "ตำแหน่ง", widget: string, required: false }
      - name: photo
        label: "รูป"
        widget: object
        required: false
        fields:
          - { name: src, label: "ไฟล์รูป", widget: image, required: false }
          - { name: alt, label: "คำอธิบายรูป (alt) ภาษาไทย", widget: string, required: false, hint: "ถ้าใส่รูป ต้องกรอกช่องนี้ด้วย" }
      - { name: instagram, label: "Instagram (ลิงก์เต็ม)", widget: string, required: false }
      - { name: facebook, label: "Facebook (ลิงก์เต็ม)", widget: string, required: false }
      - { name: youtube, label: "YouTube (ลิงก์เต็ม)", widget: string, required: false }
      - { name: email, label: "อีเมล (เช่น Gmail)", widget: string, required: false }
      - { name: phone, label: "เบอร์โทร", widget: string, required: false }
      - { name: order, label: "ลำดับ (เลขน้อยขึ้นก่อน)", widget: number, value_type: int, default: 100 }

