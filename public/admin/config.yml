# ตั้งค่าหน้าแอดมิน (Sveltia CMS) ป้ายกำกับทั้งหมดเป็นภาษาไทย
# *** แก้เฉพาะบรรทัด repo: ด้านล่างครั้งเดียวตอนติดตั้ง ***

backend:
  name: github
  repo: IamKUN67/BFF-Website-2026
  branch: main

locale: th
publish_mode: simple
site_url: https://iamkun67.github.io/BFF-Website-2026/

# รูปที่อัปโหลดเก็บใน public/uploads
media_folder: public/uploads
public_folder: /uploads

# ย่อรูปและแปลงเป็น WebP อัตโนมัติตั้งแต่ตอนอัปโหลด
media_libraries:
  default:
    config:
      max_file_size: 10485760
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

collections:
  # ───────────── 1) ตั้งค่าเว็บไซต์ + 2) เมนู ─────────────
  - name: settings
    label: "ตั้งค่าเว็บไซต์"
    files:
      - name: site
        label: "ตั้งค่าทั่วไป"
        file: src/content/settings/site.json
        format: json
        fields:
          - { name: siteName, label: "ชื่อเว็บไซต์", widget: string }
          - { name: tagline, label: "ชื่อรอง", widget: string, required: false }
          - { name: welcomeTitle, label: "หัวข้อต้อนรับหน้าแรก", widget: string, required: false }
          - { name: welcomeText, label: "ข้อความต้อนรับหน้าแรก", widget: text, required: false }
          - name: logo
            label: "รูปโลโก้"
            widget: object
            required: false
            fields:
              - { name: src, label: "ไฟล์รูป", widget: image, required: false }
              - { name: alt, label: "คำอธิบายรูป (alt) ภาษาไทย", widget: string, required: false, hint: "ถ้าใส่รูป ต้องกรอกช่องนี้ด้วย" }
          - name: cover
            label: "รูปปก"
            widget: object
            required: false
            fields:
              - { name: src, label: "ไฟล์รูป", widget: image, required: false }
              - { name: alt, label: "คำอธิบายรูป (alt) ภาษาไทย", widget: string, required: false, hint: "ถ้าใส่รูป ต้องกรอกช่องนี้ด้วย" }
          - name: colors
            label: "สีของเว็บไซต์"
            widget: object
            fields:
              - { name: primary, label: "สีหลัก", widget: color, default: "#1a73c4" }
              - { name: accent, label: "สีเน้น", widget: color, default: "#d32f2f" }
          - name: social
            label: "ลิงก์โซเชียล"
            widget: object
            fields:
              - { name: instagram, label: "Instagram (ลิงก์เต็ม)", widget: string, required: false }
              - { name: facebook, label: "Facebook (ลิงก์เต็ม)", widget: string, required: false }
              - { name: youtube, label: "YouTube (ลิงก์เต็ม)", widget: string, required: false }
              - { name: line, label: "LINE (ลิงก์เต็ม)", widget: string, required: false }
              - { name: discord, label: "Discord (ลิงก์เชิญ)", widget: string, required: false }
          - { name: email, label: "อีเมล", widget: string, required: false }
          - { name: address, label: "ที่อยู่", widget: text, required: false }
          - { name: footerText, label: "ข้อความท้ายเว็บ", widget: string, required: false }
          - { name: goatcounterCode, label: "รหัส GoatCounter นับยอดเข้าชม (เช่น bff ถ้าหน้าสถิติคือ bff.goatcounter.com) เว้นว่าง = ไม่นับ", widget: string, required: false }
          - { name: cloudflareToken, label: "โทเคน Cloudflare Web Analytics (ใช้แทน GoatCounter ได้ เว้นว่าง = ไม่ใช้)", widget: string, required: false }

      - name: labels
        label: "ข้อความในหน้าเว็บ"
        file: src/data/labels.json
        format: json
        fields:
          - { name: skipToContent, label: "ลิงก์ข้ามไปเนื้อหา (สำหรับโปรแกรมอ่านจอ)", widget: string }
          - { name: menuButton, label: "ปุ่มเปิด/ปิดเมนู (โปรแกรมอ่านจอ)", widget: string }
          - { name: mainNav, label: "ชื่อกลุ่มเมนูหลัก (โปรแกรมอ่านจอ)", widget: string }
          - { name: subMenuButton, label: "ปุ่มเปิด/ปิดเมนูย่อย (โปรแกรมอ่านจอ)", widget: string }
          - { name: heroCta, label: "ปุ่มในส่วนต้อนรับ", widget: string }
          - { name: latestNewsTitle, label: "หัวข้อ: ข่าวล่าสุด", widget: string }
          - { name: allNews, label: "ปุ่ม: ดูข่าวทั้งหมด", widget: string }
          - { name: calendarTitle, label: "หัวข้อ: ปฏิทินกิจกรรม", widget: string }
          - { name: upcomingEvents, label: "หัวข้อ: กิจกรรมที่กำลังจะมาถึง", widget: string }
          - { name: noEvents, label: "ข้อความเมื่อไม่มีกิจกรรม", widget: string }
          - { name: prevMonth, label: "ปุ่มเดือนก่อนหน้า", widget: string }
          - { name: nextMonth, label: "ปุ่มเดือนถัดไป", widget: string }
          - { name: eventLocation, label: "คำว่า สถานที่", widget: string }
          - { name: eventLink, label: "ลิงก์ดูรายละเอียดกิจกรรม", widget: string }
          - { name: contactTitle, label: "หัวข้อ: ติดต่อเรา", widget: string }
          - { name: contactEmpty, label: "ข้อความเมื่อยังไม่มีข้อมูลติดต่อ", widget: string }
          - { name: emailLabel, label: "คำว่า อีเมล", widget: string }
          - { name: addressLabel, label: "คำว่า ที่อยู่", widget: string }
          - { name: moreContact, label: "ปุ่มช่องทางติดต่อเพิ่มเติม", widget: string }
          - { name: newsPageTitle, label: "หัวข้อหน้าข่าว", widget: string }
          - { name: searchLabel, label: "ชื่อช่องค้นหา", widget: string }
          - { name: searchPlaceholder, label: "ข้อความในช่องค้นหา", widget: string }
          - { name: categoryLabel, label: "ชื่อตัวกรองหมวดหมู่", widget: string }
          - { name: allCategories, label: "ตัวเลือก: ทุกหมวดหมู่", widget: string }
          - { name: noResults, label: "ข้อความเมื่อค้นไม่เจอ", widget: string }
          - { name: noNews, label: "ข้อความเมื่อยังไม่มีข่าว", widget: string }
          - { name: prevPage, label: "ปุ่มหน้าก่อนหน้า", widget: string }
          - { name: nextPage, label: "ปุ่มหน้าถัดไป", widget: string }
          - { name: pageOf, label: "ข้อความเลขหน้า (คง {page} และ {total} ไว้)", widget: string }
          - { name: newBadge, label: "ป้าย New", widget: string }
          - { name: pinnedBadge, label: "ป้ายปักหมุด", widget: string }
          - { name: postedOn, label: "คำว่า โพสต์เมื่อ", widget: string }
          - { name: updatedOn, label: "คำว่า อัปเดตเมื่อ", widget: string }
          - { name: openChannel, label: "ข้อความบนการ์ดช่องทางติดต่อ", widget: string }
          - { name: openLink, label: "ปุ่มบนการ์ดลิงก์ใหญ่", widget: string }
          - { name: socialYoutube, label: "ชื่อ YouTube", widget: string }
          - { name: closeImage, label: "ปุ่มปิดรูปขยาย (โปรแกรมอ่านจอ)", widget: string }
          - { name: prevImage, label: "ปุ่มรูปก่อนหน้า (โปรแกรมอ่านจอ)", widget: string }
          - { name: nextImage, label: "ปุ่มรูปถัดไป (โปรแกรมอ่านจอ)", widget: string }
          - { name: zoomImage, label: "ข้อความรูปที่กดขยายได้ (โปรแกรมอ่านจอ)", widget: string }
          - { name: videoDefaultTitle, label: "ชื่อวิดีโอเริ่มต้น (โปรแกรมอ่านจอ)", widget: string }
          - { name: teachersTitle, label: "หัวข้อ: ครูผู้สอน", widget: string }
          - { name: coursesTitle, label: "หัวข้อ: คอร์สเรียน", widget: string }
          - { name: courseSchedule, label: "คำว่า วันและเวลาเรียน", widget: string }
          - { name: coursePeriod, label: "คำว่า ช่วงเวลาที่เปิดสอน", widget: string }
          - { name: courseTeachers, label: "คำว่า ครูผู้สอน (ในการ์ดคอร์ส)", widget: string }
          - { name: relatedNews, label: "หัวข้อ: ข่าวประชาสัมพันธ์ (ท้ายหน้าวิชา)", widget: string }
          - { name: enterHome, label: "ปุ่มเข้าสู่หน้าหลัก (ถ้าไม่ได้ตั้งปุ่มเอง)", widget: string }
          - { name: introLabel, label: "ชื่อกลุ่มสไลด์ (โปรแกรมอ่านจอ)", widget: string }
          - { name: slidePrev, label: "ปุ่มสไลด์ก่อนหน้า", widget: string }
          - { name: slideNext, label: "ปุ่มสไลด์ถัดไป", widget: string }
          - { name: slidePause, label: "ปุ่มหยุดเลื่อนอัตโนมัติ", widget: string }
          - { name: slidePlay, label: "ปุ่มเริ่มเลื่อนอัตโนมัติ", widget: string }
          - { name: slideGoto, label: "จุดเลือกสไลด์ (คง {n} ไว้)", widget: string }
          - { name: openFile, label: "ปุ่มเปิดไฟล์ในสไลด์", widget: string }
          - { name: searchButton, label: "ปุ่มค้นหา (โปรแกรมอ่านจอ)", widget: string }
          - { name: searchTitle, label: "ชื่อกล่องค้นหา", widget: string }
          - { name: searchClose, label: "ปุ่มปิดการค้นหา", widget: string }
          - { name: searchHint, label: "ข้อความแนะนำในกล่องค้นหา", widget: string }
          - { name: searchCount, label: "ข้อความจำนวนผลลัพธ์ (คง {n} ไว้)", widget: string }
          - { name: searchNoResult, label: "ข้อความเมื่อค้นไม่เจอ", widget: string }
          - { name: searchTypeNews, label: "ป้ายประเภท: ข่าว", widget: string }
          - { name: searchTypePage, label: "ป้ายประเภท: หน้า", widget: string }
          - { name: searchTypeCourse, label: "ป้ายประเภท: คอร์สเรียน", widget: string }
          - { name: searchTypeTeacher, label: "ป้ายประเภท: ครู", widget: string }
          - { name: searchTypeEvent, label: "ป้ายประเภท: กิจกรรม", widget: string }
          - { name: embedDefaultTitle, label: "ชื่อกรอบฝังเริ่มต้น (โปรแกรมอ่านจอ)", widget: string }
          - { name: embedOpen, label: "ปุ่มเปิดแบบฟอร์มในแท็บใหม่", widget: string }
          - { name: shareTitle, label: "ข้อความ: แชร์ข่าวนี้", widget: string }
          - { name: shareCopy, label: "ปุ่มคัดลอกลิงก์", widget: string }
          - { name: shareCopied, label: "ข้อความหลังคัดลอกลิงก์", widget: string }
          - { name: shareLine, label: "ปุ่มแชร์ LINE", widget: string }
          - { name: shareFacebook, label: "ปุ่มแชร์ Facebook", widget: string }
          - { name: fontSizeButton, label: "ปุ่มปรับขนาดตัวอักษร", widget: string }
          - { name: fontSize0, label: "ขนาดตัวอักษร: ปกติ", widget: string }
          - { name: fontSize1, label: "ขนาดตัวอักษร: ใหญ่", widget: string }
          - { name: fontSize2, label: "ขนาดตัวอักษร: ใหญ่มาก", widget: string }
          - { name: tabAll, label: "แท็บข่าว: ทั้งหมด", widget: string }
          - { name: updateBadge, label: "ป้ายข่าวที่แก้ไขภายหลัง", widget: string }
          - { name: courseApply, label: "ปุ่มสมัครคอร์ส", widget: string }
          - { name: courseOpen, label: "ป้าย: เปิดรับสมัคร", widget: string }
          - { name: courseClosed, label: "ป้าย: ปิดรับสมัครแล้ว", widget: string }
          - { name: courseEnded, label: "ป้าย: คอร์สนี้จบแล้ว", widget: string }
          - { name: courseTabInfo, label: "แท็บคอร์ส: รายละเอียด", widget: string }
          - { name: courseTabDocs, label: "แท็บคอร์ส: เอกสาร", widget: string }
          - { name: docDownload, label: "ปุ่มดาวน์โหลดเอกสาร", widget: string }
          - { name: downloadsTitle, label: "หัวข้อหน้าดาวน์โหลดเอกสาร", widget: string }
          - { name: downloadsSearch, label: "ช่องค้นหาเอกสาร", widget: string }
          - { name: allSubjects, label: "ตัวเลือก: ทุกวิชา", widget: string }
          - { name: noDownloads, label: "ข้อความเมื่อยังไม่มีเอกสาร", widget: string }
          - { name: noDownloadsMatch, label: "ข้อความเมื่อค้นเอกสารไม่เจอ", widget: string }
          - { name: openSubjectPage, label: "ลิงก์ไปหน้าวิชา", widget: string }
          - { name: timelineTitle, label: "หัวข้อหน้าไทม์ไลน์", widget: string }
          - { name: timelineEmpty, label: "ข้อความเมื่อไทม์ไลน์ว่าง", widget: string }
          - { name: memoriesTitle, label: "หัวข้อกลุ่มรูปแต่ละปี", widget: string }
          - { name: yearPrefix, label: "คำนำหน้าปี", widget: string }
          - { name: timelineJump, label: "ชื่อแถบเลือกปี (โปรแกรมอ่านจอ)", widget: string }
          - { name: searchTypeTimeline, label: "ป้ายประเภทค้นหา: ไทม์ไลน์", widget: string }
          - { name: timelineSortLabel, label: "คำว่า เรียงลำดับ (ไทม์ไลน์)", widget: string }
          - { name: timelineOldest, label: "ปุ่ม: เรียงจากเก่าไปใหม่", widget: string }
          - { name: timelineNewest, label: "ปุ่ม: เรียงจากใหม่ไปเก่า", widget: string }
          - { name: slideSound, label: "ปุ่มเปิด/ปิดเสียงวิดีโอ (โปรแกรมอ่านจอ)", widget: string }
          - { name: galleryTitle, label: "หัวข้ออัลบั้มรูป", widget: string }
          - { name: backToNews, label: "ลิงก์กลับไปหน้าข่าว", widget: string }
          - { name: boardTitle, label: "หัวข้อส่วนผู้บริหาร", widget: string }
          - { name: noBoard, label: "ข้อความเมื่อยังไม่มีรายชื่อ", widget: string }
          - { name: notFoundTitle, label: "หัวข้อหน้าไม่พบ", widget: string }
          - { name: notFoundText, label: "ข้อความหน้าไม่พบ", widget: string }
          - { name: backHome, label: "ปุ่มกลับหน้าแรก", widget: string }
          - { name: externalHint, label: "คำอธิบายลิงก์ที่เปิดแท็บใหม่ (โปรแกรมอ่านจอ)", widget: string }
          - { name: socialInstagram, label: "ชื่อ Instagram", widget: string }
          - { name: socialFacebook, label: "ชื่อ Facebook", widget: string }
          - { name: socialLine, label: "ชื่อ LINE", widget: string }
          - { name: socialDiscord, label: "ชื่อ Discord", widget: string }
          - { name: newsCategories, label: "หมวดหมู่ข่าวในตัวกรอง (ควรตรงกับหมวดในฟอร์มข่าว)", widget: list, field: { name: category, label: "ชื่อหมวด", widget: string } }

      - name: intro
        label: "หน้าสไลด์ต้อนรับ (หน้าแรกสุดของลิงก์เว็บ)"
        file: src/content/intro/intro.json
        format: json
        fields:
          - { name: enabled, label: "เปิดใช้หน้าสไลด์ต้อนรับ (ปิด = เข้าหน้าหลักทันที)", widget: boolean, default: true }
          - { name: title, label: "หัวข้อ", widget: string, required: false }
          - { name: subtitle, label: "ข้อความรอง", widget: string, required: false }
          - { name: autoplay, label: "เลื่อนสไลด์อัตโนมัติ", widget: boolean, default: true }
          - { name: interval, label: "เวลาต่อสไลด์ (วินาที)", widget: number, value_type: int, min: 3, max: 30, default: 6 }
          - name: fit
            label: "การแสดงรูป/วิดีโอในสไลด์ (ค่าเริ่มต้นของทุกสไลด์)"
            widget: select
            default: "cover"
            required: false
            options:
              - { label: "เต็มจอ ตัดขอบเล็กน้อย (แนะนำ เหมาะกับรูป 16:9)", value: "cover" }
              - { label: "พอดีทั้งรูป ไม่ตัด (มีพื้นหลังเบลอเติมข้างๆ)", value: "contain" }
          - name: slides
            label: "สไลด์ (ลากเรียงลำดับได้)"
            label_singular: "สไลด์"
            widget: list
            required: false
            summary: "{{fields.caption}} {{fields.file}} {{fields.youtube}}"
            fields:
              - { name: file, label: "ไฟล์ (รูป วิดีโอ MP4 หรือไฟล์อื่นๆ) แนะนำรูป 1920×1080 (16:9) — วิดีโอยาวให้ใช้ลิงก์ YouTube แทน", widget: file, required: false }
              - { name: youtube, label: "หรือวางลิงก์ YouTube (ถ้าใส่ จะใช้ YouTube แทนไฟล์)", widget: string, required: false }
              - { name: alt, label: "คำอธิบายรูป/วิดีโอ (alt) ภาษาไทย", widget: string, required: false }
              - { name: caption, label: "ข้อความใต้สไลด์", widget: string, required: false }
              - name: fit
                label: "การแสดงสไลด์นี้ (ถ้าไม่เลือก ใช้ตามค่าเริ่มต้นด้านบน)"
                widget: select
                required: false
                options:
                  - { label: "เต็มจอ ตัดขอบเล็กน้อย", value: "cover" }
                  - { label: "พอดีทั้งรูป ไม่ตัด", value: "contain" }
              - name: focus
                label: "จุดสนใจของรูป (เมื่อโดนตัดขอบ เช่น บนมือถือ)"
                widget: select
                default: "center"
                required: false
                options:
                  - { label: "กลาง", value: "center" }
                  - { label: "บน", value: "top" }
                  - { label: "ล่าง", value: "bottom" }
                  - { label: "ซ้าย", value: "left" }
                  - { label: "ขวา", value: "right" }
          - name: buttons
            label: "ปุ่มในหน้าสไลด์ (เพิ่มเองได้ ลิงก์ในเว็บขึ้นต้นด้วย / เช่น /home/ หรือลิงก์นอกเว็บขึ้นต้นด้วย https://)"
            label_singular: "ปุ่ม"
            widget: list
            required: false
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: "ข้อความบนปุ่ม", widget: string }
              - { name: url, label: "ลิงก์ปลายทาง", widget: string }
              - { name: color, label: "สีปุ่ม (สีตัวอักษรจะปรับให้อ่านชัดเอง)", widget: color, required: false }

      - name: menu
        label: "เมนู"
        file: src/content/menu/menu.json
        format: json
        fields:
          - name: items
            label: "รายการเมนูหลัก (ลากเพื่อเรียงลำดับ)"
            label_singular: "เมนู"
