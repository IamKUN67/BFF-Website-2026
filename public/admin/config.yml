                widget: select
                default: "16:9"
                required: false
                options:
                  - { label: "16:9 (ปกติ)", value: "16:9" }
                  - { label: "4:3", value: "4:3" }
                  - { label: "1:1 (สี่เหลี่ยมจัตุรัส)", value: "1:1" }
                  - { label: "9:16 (แนวตั้ง เช่น Shorts ควรตั้งความกว้าง 30–50%)", value: "9:16" }

